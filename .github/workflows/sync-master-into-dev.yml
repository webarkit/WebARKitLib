name: Sync master into dev

# WebARKitLib#70: after a release lands on master, open (or update) a master -> dev
# PR so the two branches cannot silently drift apart. Silent when dev already
# contains master.
#
# One stable branch, one PR, updated in place -- never closed or deleted by this
# workflow -- so conflict-resolution commits a contributor pushes onto the sync
# branch are always kept, and PRs the workflow did not create are never touched
# (#92): a PR from the sync branch is the workflow's own only if it carries the
# branch-sync label and either the hidden marker in its body or a bot author; for any
# other the workflow stops with an error instead of pushing to the branch or editing it.
#
# A master that conflicts with the sync branch is not left silent either: with a sync
# PR open it comments there, and with none open (an earlier sync PR was closed without
# merging) it opens one from the existing branch, telling whoever merges it to resolve
# the conflict there.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-master-into-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LABEL: branch-sync
      BRANCH: chore/sync-master-into-dev
      # Hidden in the body of every PR the workflow opens; see the ownership check below.
      MARKER: "<!-- sync-master-into-dev:workflow -->"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether dev already contains master
        id: check
        run: |
          git fetch origin master dev
          if git merge-base --is-ancestor origin/master origin/dev; then
            echo "dev already contains master; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            sha=$(git rev-parse --short origin/master)
            echo "dev is $(git rev-list --count origin/dev..origin/master) commit(s) behind master ($sha)."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the sync PR
        id: pr
        if: steps.check.outputs.needed == 'true'
        run: |
          # Only a PR whose head is this workflow's branch in this repository is a candidate.
          prs=$(gh pr list --base dev --head "$BRANCH" --state open \
                  --json number,headRepositoryOwner,labels,body,author \
                  --jq "[.[] | select(.headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\")]")
          number=$(echo "$prs" | jq -r '.[0].number // empty')
          if [ -n "$number" ]; then
            owned=$(echo "$prs" | jq -r --arg label "$LABEL" --arg marker "$MARKER" \
              '.[0] | ((.labels | map(.name) | index($label)) != null) and (((.body // "") | contains($marker)) or (.author.is_bot // false))')
            if [ "$owned" != "true" ]; then
              echo "::error::Open PR #$number from $BRANCH to dev was not opened by this workflow (it needs the $LABEL label and either the workflow's marker or a bot author). Not touching it or $BRANCH: close it or rename its branch, then run this workflow again."
              exit 1
            fi
            echo "Sync PR #$number is the workflow's own."
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Update the sync branch
        id: branch
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Creating $BRANCH at master."
            git push origin "origin/master:refs/heads/$BRANCH"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "$BRANCH"
          head=$(git rev-parse FETCH_HEAD)

          if git merge-base --is-ancestor origin/master "$head"; then
            echo "$BRANCH already contains master."
          elif git merge-base --is-ancestor "$head" origin/master; then
            # Nothing of its own: fast-forward.
            git push origin "origin/master:refs/heads/$BRANCH"
          elif [ -z "$(git rev-list "origin/dev..$head" ^origin/master)" ]; then
            # Its extra commits are already in dev (a previous sync was merged):
            # nothing to keep, so restart it at master. The lease guards against a
            # push that lands between the fetch above and this one.
            git push --force-with-lease="refs/heads/$BRANCH:$head" \
              origin "origin/master:refs/heads/$BRANCH"
          else
            # It carries unmerged work (e.g. conflict resolution): keep it and
            # merge master on top.
            git checkout -q --detach "$head"
            if git merge --no-edit origin/master; then
              git push origin "HEAD:refs/heads/$BRANCH"
            else
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              echo "::warning::master conflicts with work on $BRANCH; leaving it for a human."
            fi
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the sync PR
        if: steps.branch.outputs.updated == 'true'
        env:
          SHA: ${{ steps.check.outputs.sha }}
          CONFLICT: ${{ steps.branch.outputs.conflict }}
          # The open sync PR, already checked to be the workflow's own (empty when there is none).
          pr: ${{ steps.pr.outputs.number }}
        run: |
          gh label create "$LABEL" --color FBCA04 \
            --description "master -> dev branch sync; merge with a merge commit" 2>/dev/null || true

          if [ -n "$pr" ]; then
            if [ "$CONFLICT" = "true" ]; then
              gh pr comment "$pr" --body "master moved to \`$SHA\` but merging it into \`$BRANCH\` conflicts with the commits already on that branch. Please merge \`master\` into \`$BRANCH\` by hand and push."
            else
              gh pr edit "$pr" --title "chore: sync master into dev ($SHA)"
              echo "Updated sync PR #$pr to $SHA."
            fi
            exit 0
          fi

          # No sync PR is open. When $BRANCH conflicts with master (an earlier sync PR was
          # closed without merging and the branch kept its commits) a PR is opened anyway:
          # a warning in the Actions log would let dev drift behind master in silence (#92).
          {
            echo "$MARKER"
            echo
            if [ "$CONFLICT" = "true" ]; then
              cat <<BODY
          > [!WARNING]
          > \`master\` (\`$SHA\`) **conflicts** with the commits already on \`$BRANCH\`, left there by an
          > earlier sync PR that was closed without merging. Merge \`master\` into \`$BRANCH\` by hand,
          > resolve the conflict and push; then merge this PR.

          BODY
            fi
            cat <<BODY
          Automated sync of \`master\` into \`dev\` (WebARKitLib#70). This PR is updated in place
          whenever \`master\` moves again.

          > [!IMPORTANT]
          > Merge with **Create a merge commit** — never squash or rebase.
          > Only a merge commit makes the master commits ancestors of \`dev\`, so the next
          > sync is a no-op. See the "Merging a branch-sync PR" section of CONTRIBUTING.md.

          If there are conflicts, resolve them on \`$BRANCH\` and push; later syncs keep
          those commits and merge master on top.
          BODY
          } > "$RUNNER_TEMP/sync-body.md"

          gh pr create --base dev --head "$BRANCH" --label "$LABEL" \
            --title "chore: sync master into dev ($SHA)" \
            --body-file "$RUNNER_TEMP/sync-body.md"
